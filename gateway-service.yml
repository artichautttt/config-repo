spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/campus
          audiences:
            - campus-api
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: department-route
              uri: lb://department-service
              predicates:
                - Path=/campus/api/departments/**
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Gateway, gateway-service
            - id: teacher-route
              uri: lb://teacher-service
              predicates:
                - Path=/campus/api/teachers/**
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Gateway, gateway-service
                - name: CircuitBreaker
                  args:
                    name: teacherCircuitBreaker
                    fallbackUri: forward:/fallback/teachers
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      teacherCircuitBreaker:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents
